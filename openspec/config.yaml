schema: spec-driven

context: |
  本项目是 Qt 6 QML 组件库 QCatUiKit 及其 Gallery。
  文档正文使用简体中文，保留 OpenSpec 英文结构标题和 SHALL / MAY / SHALL NOT。
  遵守根目录 AGENTS.md、CONTRIBUTING.md 和 src/uikit/doc/MAINTENANCE.md。
  当前 API 入口为 src/uikit/doc/README.md；UI 工作先读 skills/qcatuikit-ui/SKILL.md。
  src/uikit 为库，examples/uikit/gallery 为演示；Gallery 私有辅助能力不是库 API。
  保留现有架构和用户改动。按源码和测试核实行为，不将文档愿景作为实现证据。
  基线 specs 只描述已经实现的行为；发现的不一致、缺陷和隐患记入 Known Deviations / Technical Debt。
  编写基线不得修改业务代码、修复缺陷、重构或新增能力，不自动同步其他 spec。
  新功能和行为修改使用独立 change，不能伪装成既有基线。
  文档修改运行 python tools/check_docs.py；验证方法与执行证据分别维护于 VALIDATION.md 和 VALIDATION_HISTORY.md。

rules:
  specs:
    - 使用 SHALL、MAY、SHALL NOT，禁止使用模糊义务措辞。
    - 每条 Requirement 使用独立编号，每个 Scenario 使用 WHEN / THEN 并给出可观察结果。
    - 基线结构依次为 Purpose、Dependencies、Requirements、Data Model、Known Deviations / Technical Debt、Non-Goals、Assumptions。
    - 规约描述外部行为、输入输出、状态和错误，不描述内部算法或函数调用步骤。
    - 非基线变更的 delta specs 遵守 OpenSpec 的增删改格式，不用基线全文替代变更差异。
  proposal:
    - 明确问题、范围、非目标和对现有公开接口的影响。
  tasks:
    - 按实际改动列出实现及相关验证，避免将未执行检查写为已通过。
